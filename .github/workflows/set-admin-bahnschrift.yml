name: Set Admin Font to Bahnschrift

on:
  push:
    paths:
      - '.github/workflows/set-admin-bahnschrift.yml'

permissions:
  contents: write

jobs:
  set-font:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update admin font
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')
          old = 'font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif'
          new = 'font-family:"Bahnschrift","Segoe UI",Arial,sans-serif'
          if old not in s:
              raise SystemExit('Target admin font declaration not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit font update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git diff --cached --quiet || git commit -m 'Change admin font to Bahnschrift'
          git push
