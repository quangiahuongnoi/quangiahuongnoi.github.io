name: Patch TikTok Live Monitor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-tiktok-live-monitor.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Replace TikTok monitor
        env:
          TARGET: worker/worker.js
          WORKFLOW: .github/workflows/patch-tiktok-live-monitor.yml
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("worker/worker.js")
          text = path.read_text(encoding="utf-8")

          start = text.find("async function runTikTokLiveMonitor(env) {")
          end = text.find("async function syncLiveFromSource", start)
          if start < 0 or end < 0:
              raise SystemExit("Không tìm thấy runTikTokLiveMonitor hoặc syncLiveFromSource trong worker/worker.js")

          new_function = r'''async function runTikTokLiveMonitor(env) {
  const username = String(env.TIKTOK_USERNAME || "quangiahuongnoi")
    .trim()
    .replace(/^@+/, "");

  if (!username) {
    throw new HttpError(500, "Chưa cấu hình TIKTOK_USERNAME.");
  }

  if (!env.TIKTOOL_API_KEY) {
    throw new HttpError(500, "Worker chưa có TIKTOOL_API_KEY.");
  }

  // Sandbox tier: /webcast/live_status được hỗ trợ.
  // /webcast/bulk_live_check yêu cầu Basic+, nên không dùng endpoint đó ở đây.
  // live_status là cache hint: không được dùng kết quả offline để tắt một LIVE đang hiện hữu.
  const endpoint =
    "https://api.tik.tools/webcast/live_status?uniqueId=" +
    encodeURIComponent(username);

  const response = await fetch(endpoint, {
    method: "GET",
    headers: {
      Accept: "application/json",
      "x-api-key": env.TIKTOOL_API_KEY
    },
    cache: "no-store"
  });

  if (!response.ok) {
    const detail = await response.text().catch(() => "");
    throw new Error(
      "TikTool API " +
      response.status +
      (detail ? ": " + detail.slice(0, 300) : "")
    );
  }

  const payload = await response.json();
  const result = payload?.data && typeof payload.data === "object"
    ? payload.data
    : null;

  if (!result || typeof result.is_live !== "boolean") {
    return {
      ok: true,
      changed: false,
      state: "unknown",
      username,
      reason: "TikTool live_status chưa xác nhận được trạng thái LIVE."
    };
  }

  const existing = await getGithubFile(env, "content.json");
  if (!existing) {
    throw new HttpError(404, "Không tìm thấy content.json.");
  }

  let content;
  try {
    content = JSON.parse(decodeBase64(existing.content));
  } catch {
    throw new HttpError(500, "content.json hiện tại không hợp lệ.");
  }

  const currentLive =
    content.live && typeof content.live === "object"
      ? content.live
      : {};

  const isLive = result.is_live === true;

  // live_status chỉ là cache hint. Nếu website đang LIVE mà endpoint trả false,
  // giữ nguyên LIVE để tránh tắt nhầm do cache chưa theo kịp.
  if (!isLive && currentLive.enabled) {
    return {
      ok: true,
      changed: false,
      state: "offline_hint",
      username,
      live: currentLive,
      cached: result.cached ?? null,
      roomId: result.room_id || null,
      reason:
        "TikTool live_status báo offline nhưng đang giữ trạng thái LIVE hiện tại vì endpoint này chỉ là cache hint."
    };
  }

  if (!isLive) {
    if (!currentLive.enabled) {
      return {
        ok: true,
        changed: false,
        state: "offline",
        username,
        live: currentLive,
        cached: result.cached ?? null,
        roomId: result.room_id || null
      };
    }
  }

  if (isLive) {
    const nextTitle = String(
      env.TIKTOK_LIVE_TITLE ||
      currentLive.title ||
      "Quản gia đang livestream"
    )
      .trim()
      .slice(0, 120);

    const nextGame = String(
      env.TIKTOK_LIVE_GAME ||
      currentLive.game ||
      ""
    )
      .trim()
      .slice(0, 80);

    const nextDetail = String(
      env.TIKTOK_LIVE_DETAIL ||
      currentLive.detail ||
      "Đang livestream trên TikTok. Vào xem và trò chuyện cùng mình nhé."
    )
      .trim()
      .slice(0, 220);

    const nextUrl =
      "https://www.tiktok.com/@" +
      encodeURIComponent(username) +
      "/live";

    const metadataChanged =
      !currentLive.enabled ||
      String(currentLive.statusLabel || "") !== "Đang live" ||
      String(currentLive.game || "") !== nextGame ||
      String(currentLive.title || "") !== nextTitle ||
      String(currentLive.detail || "") !== nextDetail ||
      String(currentLive.url || "") !== nextUrl;

    if (!metadataChanged) {
      return {
        ok: true,
        changed: false,
        state: "live",
        username,
        live: currentLive,
        cached: result.cached ?? null,
        roomId: result.room_id || null
      };
    }

    content.live = {
      enabled: true,
      statusLabel: "Đang live",
      game: nextGame,
      title: nextTitle,
      detail: nextDetail,
      url: nextUrl
    };

    console.log(
      "[live-monitor] LIVE detected",
      JSON.stringify({
        username,
        cached: result.cached ?? null,
        roomId: result.room_id || null
      })
    );
  }

  content.updatedAt = new Date().toISOString();

  await putGithubText(
    env,
    "content.json",
    JSON.stringify(content, null, 2) + "\n",
    isLive
      ? "TikTok Live Monitor: phát hiện LIVE"
      : "TikTok Live Monitor: phát hiện OFFLINE",
    existing.sha
  );

  let discord = {
    ok: false,
    configured: false
  };

  if (env.DISCORD_BOT_URL && env.DISCORD_WEBHOOK_SECRET) {
    try {
      const discordResult = await syncDiscordLive(env, content.live);
      discord = {
        ok: true,
        configured: true,
        status: discordResult.status
      };
    } catch (error) {
      const message = error?.message || String(error);
      console.warn("[discord] Live monitor sync failed:", message);
      discord = {
        ok: false,
        configured: true,
        error: message
      };
    }
  }

  return {
    ok: true,
    changed: true,
    state: isLive ? "live" : "offline",
    username,
    live: content.live,
    discord,
    cached: result.cached ?? null,
    roomId: result.room_id || null
  };
}

'''

          patched = text[:start] + new_function + text[end:]
          path.write_text(patched, encoding="utf-8")
          print("TikTok monitor patched successfully")
          PY

      - name: Commit patched worker and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/worker.js .github/workflows/patch-tiktok-live-monitor.yml
          git rm .github/workflows/patch-tiktok-live-monitor.yml
          git commit -m "fix: use sandbox-compatible TikTok live monitor"
          git push origin HEAD:main
