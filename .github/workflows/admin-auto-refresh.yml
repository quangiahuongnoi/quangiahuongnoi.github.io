name: Repair Admin JavaScript

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip admin repair]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair admin.html without touching dashboard
        shell: python
        run: |
          from pathlib import Path

          path = Path('admin.html')
          text = path.read_text(encoding='utf-8')
          fixed = r'''\n/* ADMIN_AUTO_REFRESH_FIXED */\nconst ADMIN_AUTO_REFRESH_MS=10000;\nlet adminRefreshBusy=false;\nasync function autoRefreshAdmin(){\n  if(adminRefreshBusy||dirty||document.hidden||!token||!api)return;\n  adminRefreshBusy=true;\n  try{\n    const d=await req('/content');\n    const next=normalize(d.content);\n    const wasLive=!!state?.live?.enabled;\n    const isLive=!!next.live?.enabled;\n    state=next;\n    fill();\n    if(wasLive!==isLive){\n      msg($('saveStatus'),isLive?'🔴 LIVE vừa được phát hiện tự động.':'⚫ Livestream đã kết thúc.','ok');\n    }\n  }catch(e){\n    console.warn('[Admin auto-refresh]',e.message);\n  }finally{\n    adminRefreshBusy=false;\n  }\n}\nsetInterval(autoRefreshAdmin,ADMIN_AUTO_REFRESH_MS);\ndocument.addEventListener('visibilitychange',()=>{if(!document.hidden)autoRefreshAdmin()});\n'''

          marker = 'ADMIN_AUTO_REFRESH_v1'
          if marker in text:
              marker_pos = text.find(marker)
              block_start = text.rfind('/*', 0, marker_pos)
              if block_start < 0:
                  raise SystemExit('Could not locate broken auto-refresh block')
              script_end = text.find('</script>', marker_pos)
              if script_end < 0:
                  raise SystemExit('Could not locate closing script tag')
              before = text[:block_start]
              after = text[script_end:]
              close = before.rfind('})();')
              if close < 0:
                  raise SystemExit('Could not locate Admin IIFE close')
              before_iife = before[:close].rstrip('\\n\\r\\t ')
              text = before_iife + fixed + '\n})();\n' + after
          else:
              close = text.rfind('})();')
              if close < 0:
                  raise SystemExit('Could not locate Admin IIFE close')
              text = text[:close] + fixed + '\n})();\n' + text[close+5:]

          # The fixed block must be inside the IIFE; no literal escaped newline block may remain.
          if 'ADMIN_AUTO_REFRESH_v1' in text:
              raise SystemExit('Old broken auto-refresh block remains')
          if 'ADMIN_AUTO_REFRESH_FIXED' not in text:
              raise SystemExit('Fixed auto-refresh block missing')
          if text.count('})();') != 1:
              raise SystemExit('Unexpected Admin IIFE count')

          path.write_text(text, encoding='utf-8')
          print('Admin JavaScript repaired successfully.')

      - name: Commit repaired admin.html
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git commit -m "Fix Admin login JavaScript [skip admin repair]"
          git push

      - name: Remove obsolete repair workflow
        shell: bash
        run: |
          git rm -f .github/workflows/admin-auto-refresh.yml || true
          git commit -m "chore: remove temporary Admin repair workflow [skip admin repair]" || true
          git push || true
