name: Repair Admin now
on:
  push:
    paths:
      - '.github/workflows/fix-admin-now.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Revert broken Admin auto-refresh commit
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git merge-base --is-ancestor d20c345ec5627f7984a661ed7d1dc11a3dfeac1e HEAD; then
            git revert --no-edit d20c345ec5627f7984a661ed7d1dc11a3dfeac1e
          fi
      - name: Add correct Admin auto-refresh inside script
        shell: python
        run: |
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')
          if 'ADMIN_AUTO_REFRESH_FIXED' not in s:
              block = r'''
/* ADMIN_AUTO_REFRESH_FIXED */
const ADMIN_AUTO_REFRESH_MS = 10000;
let adminRefreshBusy = false;
async function autoRefreshAdmin(){
  if(adminRefreshBusy || dirty || document.hidden || !token || !api) return;
  adminRefreshBusy = true;
  try{
    const d = await req('/content');
    const next = normalize(d.content);
    const wasLive = !!state?.live?.enabled;
    const isLive = !!next.live?.enabled;
    state = next;
    fill();
    if(wasLive !== isLive){
      msg($('saveStatus'), isLive ? '🔴 LIVE vừa được phát hiện tự động.' : '⚫ Livestream đã kết thúc.', 'ok');
    }
  }catch(e){
    console.warn('[Admin auto-refresh]', e.message);
  }finally{
    adminRefreshBusy = false;
  }
}
setInterval(autoRefreshAdmin, ADMIN_AUTO_REFRESH_MS);
document.addEventListener('visibilitychange', () => {
  if(!document.hidden) autoRefreshAdmin();
});
'''
              marker = '\n})();\n</script>'
              if marker not in s:
                  raise SystemExit('Could not find Admin script closing marker')
              s = s.replace(marker, '\n' + block + '})();\n</script>', 1)
              p.write_text(s, encoding='utf-8')
      - name: Remove repair workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/fix-admin-now.yml
          git add admin.html .github/workflows/fix-admin-now.yml
          git diff --cached --quiet || git commit -m 'Fix Admin login and auto-refresh'
          git push
