name: Merge Admin Dashboard

on:
  push:
    paths:
      - '.github/workflows/merge-admin.yml'
      - 'admin-v2.html'

permissions:
  contents: write

jobs:
  merge-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build unified admin
        shell: python
        run: |
          from pathlib import Path

          legacy = Path('admin.html').read_text(encoding='utf-8')
          v2 = Path('admin-v2.html').read_text(encoding='utf-8')
          Path('admin-legacy.html').write_text(legacy, encoding='utf-8')

          # Make the legacy editor available from inside the unified dashboard.
          v2 = v2.replace(
              '<div id="legacy" class="tab" hidden><section class="card section"><h2>⚙️ Website & Music</h2><p>Toàn bộ phần chỉnh avatar, màu sắc, font, QR, social icons và music player đầy đủ vẫn đang nằm trong Admin hiện tại.</p><div class="actions"><a class="btn secondary" href="./admin.html">Mở Admin đầy đủ ↗</a></div></section></div>',
              '''<div id="legacy" class="tab" hidden>
          <section class="card section">
            <div class="section-title"><div><h2>⚙️ Website & Music</h2><p class="muted">Các công cụ chỉnh avatar, màu sắc, font, QR, social, metadata và music player đầy đủ.</p></div></div>
            <div style="display:grid;gap:12px">
              <div class="item"><div class="item-head"><h3>Admin cũ được tích hợp</h3><span class="pill">FULL EDITOR</span></div><small>Phần quản trị giao diện và music vẫn dùng cùng Worker hiện tại. Bạn không cần đăng nhập lại.</small></div>
              <iframe src="./admin-legacy.html" title="Website & Music editor" style="width:100%;min-height:900px;border:1px solid #292929;border-radius:16px;background:#070707"></iframe>
            </div>
          </section>
          </div>'''
          )

          # Remove the v2 login explanation that says the legacy editor is separate.
          v2 = v2.replace(
              'Các phần chỉnh giao diện và music đầy đủ vẫn được giữ trong Admin cũ cho tới khi bạn xác nhận bản hợp nhất.',
              'Dashboard và trình chỉnh sửa website hiện được gom vào một khu vực quản trị duy nhất.'
          )

          Path('admin.html').write_text(v2, encoding='utf-8')

      - name: Commit unified admin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html admin-legacy.html
          git diff --cached --quiet && exit 0
          git commit -m "Merge Admin Dashboard and legacy editor"
          git push
