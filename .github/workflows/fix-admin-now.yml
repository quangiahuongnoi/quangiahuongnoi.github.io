name: Repair Admin login
on:
  push:
    paths:
      - '.github/workflows/fix-admin-now.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair broken Admin JavaScript
        shell: python
        run: |
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')
          marker = "\n})();\n\\\n/* ADMIN_AUTO_REFRESH_v1"
          if marker in s:
              prefix = s.split(marker, 1)[0]
              block = r'''
/* ADMIN_AUTO_REFRESH_FIXED */
const ADMIN_AUTO_REFRESH_MS = 10000;
let adminRefreshBusy = false;
async function autoRefreshAdmin(){
  if(adminRefreshBusy || dirty || document.hidden || !token || !api) return;
  adminRefreshBusy = true;
  try{
    const d = await req('/content');
    const next = normalize(d.content);
    const wasLive = !!state?.live?.enabled;
    const isLive = !!next.live?.enabled;
    state = next;
    fill();
    if(wasLive !== isLive){
      msg($('saveStatus'), isLive ? '🔴 LIVE vừa được phát hiện tự động.' : '⚫ Livestream đã kết thúc.', 'ok');
    }
  }catch(e){
    console.warn('[Admin auto-refresh]', e.message);
  }finally{
    adminRefreshBusy = false;
  }
}
setInterval(autoRefreshAdmin, ADMIN_AUTO_REFRESH_MS);
document.addEventListener('visibilitychange', () => {
  if(!document.hidden) autoRefreshAdmin();
});
'''
              s = prefix + '\n' + block + '\n})();\n</script>\n</body>\n</html>\n'
          else:
              raise SystemExit('Broken Admin auto-refresh marker not found; refusing to modify admin.html')
          p.write_text(s, encoding='utf-8')
      - name: Validate Admin JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('admin.html').read_text(encoding='utf-8')
          assert '\\n/* ADMIN_AUTO_REFRESH_v1' not in s, 'Old broken auto-refresh block remains'
          assert 'ADMIN_AUTO_REFRESH_FIXED' in s, 'Fixed auto-refresh block missing'
          assert s.count('})();') == 1, 'Unexpected IIFE count'
          print('Admin repair validation passed')
          PY
      - name: Commit repaired Admin and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-admin-now.yml
          git add admin.html .github/workflows/fix-admin-now.yml
          git diff --cached --quiet || git commit -m 'Fix Admin login JavaScript'
          git push

# Trigger repair for the current main branch.
