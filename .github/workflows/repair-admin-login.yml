name: Repair admin login

on:
  push:
    branches: [main]

jobs:
  repair:
    if: github.event.head_commit.message != 'fix: repair admin login javascript'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair admin.html JavaScript
        shell: python
        run: |
          from pathlib import Path

          path = Path('admin.html')
          text = path.read_text(encoding='utf-8')
          marker = '/* ADMIN_AUTO_REFRESH_v1'

          if marker in text:
              text = text.split(marker, 1)[0].rstrip('\\')
              replacement = '''
/* ADMIN_AUTO_REFRESH_v1
   Poll the Worker every 10 seconds. Never overwrite unsaved Admin edits. */
const ADMIN_AUTO_REFRESH_MS=10000;
let adminRefreshBusy=false;
async function autoRefreshAdmin(){
  if(adminRefreshBusy||dirty||document.hidden||!token||!api)return;
  adminRefreshBusy=true;
  try{
    const d=await req('/content');
    const next=normalize(d.content);
    const wasLive=!!state?.live?.enabled;
    const isLive=!!next.live?.enabled;
    state=next;
    fill();
    if(wasLive!==isLive){
      msg($('saveStatus'),isLive?'🔴 LIVE vừa được phát hiện tự động.':'⚫ Livestream đã kết thúc.','ok');
    }
  }catch(e){
    console.warn('[Admin auto-refresh]',e.message);
  }finally{adminRefreshBusy=false}
}
setInterval(autoRefreshAdmin,ADMIN_AUTO_REFRESH_MS);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)autoRefreshAdmin()});
// ADMIN_AUTO_REFRESH_v1
'''
              text = text + replacement + '</script>\n</body>\n</html>\n'
              path.write_text(text, encoding='utf-8')
          else:
              print('Marker not found; no repair needed.')

      - name: Commit repair and remove temporary workflow
        run: |
          rm -f .github/workflows/repair-admin-login.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html .github/workflows/repair-admin-login.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: repair admin login javascript'
          git push
